<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Государство подписчиков</title>
<meta name="description" content="Вымышленное государство, которым правят подписчики: каждый комментарий — законопроект, каждый подписчик — житель.">
<meta name="theme-color" content="#1a1209">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Ruslan+Display&display=swap" rel="stylesheet">
<style>
:root{--ink:#f6efe2;--muted:#cdbd9f;--glass:rgba(26,18,9,.8);--line:rgba(226,178,58,.32);--gold:#e2b23a;--gold2:#ffd27a;--red:#e2503f;--green:#3f9a52;
  --paper:#f5e8cb;--paper2:#ead5a8;--brown:#2b1a0e;--brown2:#6b4424;--disp:'Ruslan Display',Georgia,serif;--body:Inter,system-ui,sans-serif;--navh:64px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1209;color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:800 14px var(--body);border-radius:14px;border:1px solid transparent;padding:11px 14px;cursor:pointer;color:var(--brown);background:var(--gold);display:inline-flex;align-items:center;justify-content:center;gap:6px}
button.soft{background:rgba(43,26,14,.08);color:var(--brown);border-color:rgba(43,26,14,.12)}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
.glass{background:rgba(26,18,9,.9);border:1px solid var(--line);}
.bar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:10px;border-radius:18px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.bar .t{flex:1;min-width:0}
.bar .n{font:18px/1.1 var(--disp);color:var(--gold2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .s{font:700 12px var(--body);color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:6px;font:800 10px var(--body);letter-spacing:.14em;color:#fff;background:rgba(226,80,63,.92);padding:5px 9px;border-radius:20px;flex:none}
.live i{width:7px;height:7px;border-radius:50%;background:#fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.alert{position:fixed;left:10px;right:10px;border-radius:14px;padding:9px 12px;font:800 13px/1.3 var(--body);color:#fff;background:rgba(170,40,30,.9);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.alert.good{background:rgba(47,122,58,.9)}
#pins{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.pin{position:absolute;left:0;top:0;pointer-events:auto;padding:5px 9px 5px 6px;border-radius:20px;background:rgba(26,18,9,.84);
  border:1px solid var(--line);color:var(--ink);font:800 11px var(--body);white-space:nowrap;display:flex;align-items:center;gap:5px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.pin b{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:var(--brown);font:900 10px var(--body)}
.pin.pinlaw b{background:#8a2f24;color:#fff}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom,0px));padding:6px 6px env(safe-area-inset-bottom,0px);display:flex;background:rgba(20,13,6,.95);border-top:1px solid var(--line);z-index:5}
.nav button{flex:1;flex-direction:column;gap:3px;background:none;color:var(--muted);font:700 10.5px var(--body);padding:4px 2px;border-radius:12px}
.nav button svg{width:22px;height:22px}
.nav button[aria-selected=true]{color:var(--gold2);background:rgba(226,178,58,.1)}
.panel{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));max-height:min(54vh,560px);overflow-y:auto;overscroll-behavior:contain;
  background:linear-gradient(var(--paper),var(--paper2));color:var(--brown);border-radius:22px 22px 0 0;padding:0 16px 18px;box-shadow:0 -16px 40px rgba(0,0,0,.45);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);z-index:4;max-width:600px;margin:0 auto}
.panel.closed{transform:translateY(calc(100% + 10px))}
.grab{display:flex;justify-content:center;padding:10px 0 6px;background:none;width:100%;border:0;position:sticky;top:0;background:linear-gradient(var(--paper) 70%,transparent);z-index:1}
.grab i{width:44px;height:5px;border-radius:5px;background:rgba(43,26,14,.25)}
h2{font:24px/1.15 var(--disp);color:#5a3416;margin:0 0 2px}
h3{font:900 12px var(--body);letter-spacing:.12em;color:#8a5f36;margin:18px 0 6px;text-transform:uppercase}
.sub{font:700 13px var(--body);color:#8a5f36}
.box{background:rgba(255,255,255,.55);border:1px solid rgba(90,52,22,.14);border-radius:16px;padding:12px 14px;margin-top:10px}
.lbl{font:900 11px var(--body);letter-spacing:.14em;color:#a2342a}
.q{font:900 21px/1.2 var(--body);margin:4px 0 8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.timer{font:900 26px var(--body);font-variant-numeric:tabular-nums}
.hint{font:600 13px/1.45 var(--body);color:var(--brown2)}
.lead{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed rgba(90,52,22,.2)}
.lead .k{font:900 16px var(--body);width:22px;color:#a2342a}
.lead .x{flex:1;font:700 14px/1.3 var(--body)}
.lead .x small{display:block;font:600 12px var(--body);color:#8a5f36}
.lead .l{font:900 14px var(--body);color:#c8312f}
.stat{display:grid;grid-template-columns:32px 96px 1fr 44px;align-items:center;gap:10px;padding:7px 0}
.stat svg{width:32px;height:32px}
.stat .l{font:800 14px var(--body)}
.stat .l small{display:block;font:700 10.5px var(--body);color:#8a5f36}
.meter{height:12px;border-radius:8px;background:rgba(90,52,22,.14);overflow:hidden;position:relative}
.meter i{position:absolute;top:0;bottom:0;left:0;border-radius:8px;transition:width .5s}
.meter em{position:absolute;top:0;bottom:0;border-radius:8px;opacity:.45}
.meter u{position:absolute;top:0;bottom:0;width:2px;background:#a2342a;left:20%;opacity:.55}
.stat .v{font:900 16px var(--body);text-align:right;font-variant-numeric:tabular-nums}
.stat .v small{display:block;font:900 11px var(--body)}
.up{color:var(--green)}.down{color:#b5352a}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:800 12px var(--body);padding:4px 9px;border-radius:20px;background:rgba(43,26,14,.08)}
.chip.p{color:#2f7a3a;background:rgba(47,122,58,.13)}.chip.n{color:#a2342a;background:rgba(162,52,42,.12)}
.law{position:relative;padding:4px 0 14px 24px}
.law::before{content:"";position:absolute;left:6px;top:8px;bottom:-4px;width:2px;background:rgba(90,52,22,.2)}
.law:last-child::before{display:none}
.law::after{content:"";position:absolute;left:1px;top:6px;width:12px;height:12px;border-radius:50%;background:#8a2f24;border:2px solid var(--paper)}
.law.veto::after{background:#888}
.law .h{font:900 13px var(--body);color:#8a2f24}
.law .t{font:800 15px/1.35 var(--body);margin-top:2px}
.law .m{font:600 12px var(--body);color:#8a5f36;margin-top:4px}
.mini{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:8px}
.mini span{height:5px;border-radius:3px;background:rgba(90,52,22,.15);overflow:hidden}
.mini span i{display:block;height:100%}
.rank{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(90,52,22,.2)}
.rank .p{font:900 18px var(--body);width:28px;color:#a2342a;text-align:center}
.rank .x{flex:1;font:800 15px var(--body)}
.rank .x small{display:block;font:600 12px var(--body);color:#8a5f36}
.person{display:flex;gap:12px;align-items:center;padding:8px 0}
.person img{width:60px;height:60px;border-radius:14px;object-fit:cover;object-position:50% 18%;flex:none;border:3px solid #fff}
.person b{display:block;font:900 15px var(--body);color:#8a2f24}
.person small{font:700 12px var(--body);color:#8a5f36}
.person p{margin:2px 0 0;font:600 13px/1.35 var(--body)}
select,input{width:100%;font:700 15px var(--body);padding:11px 12px;border-radius:12px;border:1px solid rgba(90,52,22,.25);background:#fffaf0;color:var(--brown)}
.form{display:flex;gap:8px;margin-top:10px}
.form input{flex:1;min-width:0}
.dice{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.dice div{background:rgba(43,26,14,.06);border-radius:10px;padding:8px 6px;font:700 11px/1.3 var(--body);text-align:center}
.dice b{display:block;font:900 13px var(--body)}
.passport{border-radius:18px;padding:16px;background:linear-gradient(160deg,#fbf2dd,#e9cf98);border:6px double #8a5f36;margin-top:12px}
.passport .k{font:900 11px var(--body);letter-spacing:.18em;color:#8a2f24}
.passport .num{font:30px var(--disp);color:#5a1f16;margin:6px 0}
.passport .f{display:flex;justify-content:space-between;gap:10px;border-top:2px dashed rgba(90,52,22,.25);padding:7px 0;font:800 14px var(--body)}
.passport .f span{color:#8a5f36;font-weight:700}
.welcome{background:#2b1a0e;color:var(--ink);border-radius:16px;padding:14px;margin-top:4px;font:600 14px/1.5 var(--body)}
.welcome b{color:var(--gold2)}
.empty{font:600 14px/1.45 var(--body);color:var(--brown2)}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0 0}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 38px;font:600 14px/1.4 var(--body)}
.steps li::before{content:counter(s);position:absolute;left:0;top:6px;width:26px;height:26px;border-radius:50%;background:#8a2f24;color:#fff;display:grid;place-items:center;font:900 13px var(--body)}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:20;display:grid;place-items:center;padding:20px;text-align:center}
.mod img{max-width:100%;max-height:70vh;border-radius:14px;display:block;margin:0 auto}
.mod p{color:#fff;font:700 14px/1.4 var(--body);margin:12px 0}
.loading{position:fixed;inset:0;display:grid;place-items:center;background:#1a1209;z-index:50;font:22px var(--disp);color:var(--gold2);transition:opacity .6s}
@media (min-width:760px){.panel{left:20px;right:auto;width:420px;margin:0;border-radius:22px;bottom:calc(var(--navh) + 14px);max-height:calc(100vh - 200px)}.bar,.alert{right:auto;width:420px}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}.panel{transition:none}}
.mapctl{position:fixed;right:10px;top:calc(env(safe-area-inset-top,0px) + 132px);display:flex;flex-direction:column;gap:6px;z-index:3}
.mapctl button{width:42px;height:42px;padding:0;border-radius:12px;background:var(--glass);color:var(--ink);border:1px solid var(--line);font:800 20px var(--body);}
.maphint{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);background:rgba(26,18,9,.88);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:12px 16px;text-align:center;font:600 13px/1.5 var(--body);pointer-events:none;z-index:3;white-space:nowrap}
.maphint b{color:var(--gold2);font-size:15px}
.bubble{position:fixed;left:0;top:0;max-width:200px;padding:7px 10px;border-radius:14px;background:#fffaf0;color:#2b1a0e;font:700 11.5px/1.3 var(--body);box-shadow:0 6px 18px rgba(0,0,0,.35);pointer-events:auto;z-index:2;transition:opacity .3s}
.bubble::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:#fffaf0;transform:translateX(-50%) rotate(45deg)}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
<div id="stage"></div>
<div id="pins"></div>
<header class="bar glass">
  <div class="t"><div class="n" id="name">Государство без имени</div><div class="s" id="status">100 жителей · Поселение</div></div>
  <div class="live" title="Состояние обновляется само"><i></i>LIVE</div>
</header>
<div class="alert" id="alert" hidden></div>
<section class="panel" id="panel" aria-live="polite">
  <button class="grab" id="grab" aria-label="Свернуть или развернуть панель"><i></i></button>
  <div id="body"></div>
</section>
<nav class="nav" role="tablist" aria-label="Разделы">
  <button role="tab" data-tab="now"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Сейчас</button>
  <button role="tab" data-tab="state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V10l7-5 7 5v11M9 21v-6h6v6"/></svg>Государство</button>
  <button role="tab" data-tab="laws"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h3"/></svg>Законы</button>
  <button role="tab" data-tab="deputies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>Депутаты</button>
  <button role="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M8 17c1-2 7-2 8 0"/></svg>Паспорт</button>
</nav>
<div class="loading" id="loading">Государство загружается…</div>
<script>window.WORLD_SITE = true;</script>
<script type="module" src="./world.js"></script>
<script type="module" src="./app.js"></script>
</body></html>
